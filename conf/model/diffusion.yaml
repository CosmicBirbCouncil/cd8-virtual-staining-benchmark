name: diffusion_unet

net:
  _target_: diffusers.UNet2DModel
  sample_size: ${data.tile.size}
  in_channels: 6
  out_channels: 3
  layers_per_block: 2
  block_out_channels: [128, 256, 256, 512]
  down_block_types:
    - DownBlock2D
    - DownBlock2D
    - AttnDownBlock2D
    - AttnDownBlock2D
  up_block_types:
    - AttnUpBlock2D
    - AttnUpBlock2D
    - UpBlock2D
    - UpBlock2D
  norm_num_groups: 32
  dropout: 0.0

training:
  prediction_type: v_prediction
  use_ema: true
  ema_decay: 0.9999